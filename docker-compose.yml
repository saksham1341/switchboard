services:
  switchboard:
    build: .
    restart: unless-stopped
    environment:
      # --- GitHub ingress (required) ---
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}

      # --- Discord (optional) ---
      # The Discord half is wired only when DISCORD_BOT_TOKEN is set. If it is
      # set, DISCORD_APPLICATION_ID is required — the app fails fast without it.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Target channel for the github-notify relay. Unset = slash commands only,
      # no GitHub events relayed into Discord.
      DISCORD_GITHUB_NOTIFY_CHANNEL_ID: ${DISCORD_GITHUB_NOTIFY_CHANNEL_ID:-}

      # --- Dashboard ---
      # Unset SB_DASHBOARD_TOKEN entirely = no dashboard (no server, no routes).
      SB_DASHBOARD_TOKEN: ${SB_DASHBOARD_TOKEN:-}
      SB_DASHBOARD_PORT: ${SB_DASHBOARD_PORT:-8090}

      # --- Tuning ---
      SB_MAX_LOG_MESSAGES: ${SB_MAX_LOG_MESSAGES:-10000}
      SB_PORT: ${SB_PORT:-8080}
    # Both loopback only — never the LAN. The public tunnel is pointed at
    # :8080 and reaches the webhook and /health. The dashboard is on :8090,
    # published loopback too but NOT tunneled, so it is reachable over an SSH
    # tunnel and never from the internet.
    ports:
      - "127.0.0.1:${SB_HOST_PORT:-8080}:${SB_PORT:-8080}"
      - "127.0.0.1:${SB_DASHBOARD_PORT:-8090}:${SB_DASHBOARD_PORT:-8090}"
    volumes:
      - ./data:/data
