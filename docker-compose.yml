services:
  switchboard:
    build: .
    restart: unless-stopped
    environment:
      # --- GitHub ingress (required) ---
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}

      # --- Discord (optional) ---
      # The Discord half is wired only when DISCORD_BOT_TOKEN is set. If it is
      # set, DISCORD_APPLICATION_ID is required — the app fails fast without it.
      # The bot always listens for messages, so the privileged MESSAGE CONTENT
      # intent must be enabled in the Developer Portal: without it the gateway
      # refuses login and the sensor dies at start.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Target channel for the github-notify relay. Unset = slash commands only,
      # no GitHub events relayed into Discord.
      DISCORD_GITHUB_NOTIFY_CHANNEL_ID: ${DISCORD_GITHUB_NOTIFY_CHANNEL_ID:-}

      # --- Agent ---
      # The agentic decider is wired only when SB_LLM_API_KEY and Discord are
      # both set. SB_LLM_BACKEND picks the provider: "anthropic" (native), or
      # "openai" for any OpenAI-compatible endpoint (Groq, Gemini, Cerebras,
      # OpenRouter, Ollama), which also needs SB_LLM_BASE_URL.
      SB_LLM_BACKEND: ${SB_LLM_BACKEND:-anthropic}
      SB_LLM_API_KEY: ${SB_LLM_API_KEY:-}
      SB_LLM_BASE_URL: ${SB_LLM_BASE_URL:-}
      SB_LLM_MODEL: ${SB_LLM_MODEL:-}

      # --- Dashboard ---
      # Set a token to enable the live dashboard; unset = no dashboard at all.
      # It serves on the main port, so the public tunnel reaches it. The page is
      # structure-only (names, ids, causal links — never payloads or tokens),
      # which is what makes public exposure acceptable.
      SB_DASHBOARD_TOKEN: ${SB_DASHBOARD_TOKEN:-}

      # --- Tuning ---
      # How many times a message is retried before it dead-letters.
      SB_MESSAGE_MAX_RETRIES: ${SB_MESSAGE_MAX_RETRIES:-10}
      # How long a handler gets per attempt before the Bus times it out.
      SB_HANDLER_TIMEOUT_S: ${SB_HANDLER_TIMEOUT_S:-100}
      # Ceiling on the Bus's own jittered exponential backoff between retries.
      SB_RETRY_BACKOFF_MAX_S: ${SB_RETRY_BACKOFF_MAX_S:-300}
      # Ceiling the Bus clamps a handler-requested retry_after to (e.g. a 429's delay).
      SB_RETRY_AFTER_MAX_S: ${SB_RETRY_AFTER_MAX_S:-120}
      # Long-poll wait per acquire_blocking call on the consume loop.
      SB_CONSUMER_WAIT_MS: ${SB_CONSUMER_WAIT_MS:-30000}
      # How often the lease reaper sweeps for expired leases.
      SB_LEASE_REAPER_INTERVAL_S: ${SB_LEASE_REAPER_INTERVAL_S:-60}
      # How long a processed (group, msg.id) pair is remembered for dedup.
      SB_DEDUP_TTL_S: ${SB_DEDUP_TTL_S:-3600}
      # Ring-buffer size of the event log before old messages are evicted.
      SB_LOG_MAX_MESSAGES: ${SB_LOG_MAX_MESSAGES:-100000}
      # How many dead-lettered messages are kept before the oldest are dropped.
      SB_LOG_MAX_DEAD: ${SB_LOG_MAX_DEAD:-500}
      SB_PORT: ${SB_PORT:-8080}
    # Loopback only — never the LAN. Ingress (tunnel, reverse proxy, whatever)
    # is the host's concern, not this stack's; point it at 127.0.0.1:8080.
    ports:
      - "127.0.0.1:${SB_HOST_PORT:-8080}:${SB_PORT:-8080}"
    volumes:
      - ./data:/data
