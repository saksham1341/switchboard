services:
  switchboard:
    build: .
    restart: unless-stopped
    environment:
      # --- GitHub ingress (required) ---
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}

      # --- Discord (optional) ---
      # The Discord half is wired only when DISCORD_BOT_TOKEN is set. If it is
      # set, DISCORD_APPLICATION_ID is required — the app fails fast without it.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      # Target channel for the github-notify relay. Unset = slash commands only,
      # no GitHub events relayed into Discord.
      DISCORD_GITHUB_NOTIFY_CHANNEL_ID: ${DISCORD_GITHUB_NOTIFY_CHANNEL_ID:-}

      # --- Tuning ---
      SB_MAX_LOG_MESSAGES: ${SB_MAX_LOG_MESSAGES:-10000}
      SB_PORT: ${SB_PORT:-8080}
    # Published on loopback only, so a cloudflared running on the HOST can reach
    # it. Not exposed on the LAN. If you instead run the bundled tunnel below,
    # this publish is unnecessary but harmless.
    ports:
      - "127.0.0.1:${SB_HOST_PORT:-8080}:${SB_PORT:-8080}"
    volumes:
      - ./data:/data

  # Bundled Cloudflare Tunnel — ONLY for hosts without their own cloudflared.
  # Opt in with:  docker compose --profile tunnel up -d
  # Skip it when cloudflared already runs as a host service (the usual case on a
  # Pi); a second connector for the same tunnel is redundant.
  #
  # Origin depends on which one you use:
  #   host cloudflared  -> http://localhost:8080
  #   bundled tunnel    -> http://switchboard:8080   (compose network DNS)
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2024.12.2   # pinned; bump deliberately, never :latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
